<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 29 Ent: NOLA AAA Street Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010104;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 2px; }
        p { margin: 0; color: #ff007f; font-weight: bold; font-size: 16px; text-shadow: 0 0 8px rgba(255, 0, 127, 0.7); }
        
        .hud-panel {
            position: absolute;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            color: white;
            padding: 20px;
            display: none;
            z-index: 100;
        }
        #dealership-modal, #garage-modal {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .car-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid #ff007f;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .car-card h3 { margin: 0 0 5px 0; color: #00ffcc; font-size: 16px; }
        .car-card p { font-size: 13px; color: #bbb; margin-bottom: 8px; }
        .btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
            transition: 0.2s;
        }
        .btn:hover { background: #ff3399; box-shadow: 0 0 15px rgba(255, 51, 153, 1); }
        
        #menu-bar {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
        }
        .menu-btn {
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }
        .menu-btn:hover { background: #00ffcc; color: #000; }
        #controls-hint {
            position: absolute;
            bottom: 85px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>LEVEL 29 ENT: NOLA AAA</h1>
        <p id="speedometer">SPEED: 0 MPH</p>
        <p id="bank-balance" style="color: #00ffcc; margin-top: 5px;">BANK: $50,000</p>
    </div>

    <div id="controls-hint">Use <b>W / A / S / D</b> to Drive | <b>SPACE</b> to Drift | Open Dealership & Garage below</div>

    <div id="menu-bar">
        <button class="menu-btn" onclick="toggleModal('dealership-modal')">🚗 100-CAR DEALERSHIP</button>
        <button class="menu-btn" onclick="toggleModal('garage-modal')">🛠️ UPGRADE GARAGE</button>
    </div>

    <!-- 100-CAR DEALERSHIP MODAL -->
    <div id="dealership-modal" class="hud-panel">
        <div class="modal-header">
            <h2 style="margin:0; color:#00ffcc;">St. Claude Motors: 100-Car Showroom</h2>
            <button class="btn" onclick="toggleModal('dealership-modal')">✕</button>
        </div>
        <p style="margin-bottom:15px; font-size:13px; color:#aaa;">Choose from 100 authentic custom street racing builds.</p>
        <div class="car-grid" id="dealership-grid"></div>
    </div>

    <!-- UPGRADE GARAGE MODAL -->
    <div id="garage-modal" class="hud-panel">
        <div class="modal-header">
            <h2 style="margin:0; color:#ff007f;">Level 29 Tuning Workshop</h2>
            <button class="btn" onclick="toggleModal('garage-modal')">✕</button>
        </div>
        <div>
            <h3 style="color:#00ffcc;">Current Ride: <span id="current-car-name">1971 Chevy Impala Donk</span></h3>
            <div style="margin-top: 15px; display:flex; flex-direction:column; gap:10px;">
                <button class="btn" onclick="upgradeCar('Twin Turbo Kit', 5000)">Upgrade Twin Turbo (+50 Top Speed) - $5,000</button>
                <button class="btn" onclick="setCarColor(0xff0055, 0.1, 0.9)">Apply Candy Neon Pink Finish - $1,500</button>
                <button class="btn" onclick="setCarColor(0x00ffff, 0.1, 0.9)">Apply Electric Cyan Finish - $1,500</button>
                <button class="btn" onclick="upgradeCar('Hydraulics & Spinner Rims', 8000)">Install Hydraulics & 30" Spinners - $8,000</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
