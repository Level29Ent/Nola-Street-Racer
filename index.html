<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 29 Ent: NOLA AAA Street Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 2px; }
        p { margin: 0; color: #ff007f; font-weight: bold; font-size: 16px; text-shadow: 0 0 8px rgba(255, 0, 127, 0.7); }
        
        .hud-panel {
            position: absolute;
            background: rgba(10, 10, 25, 0.95);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            color: white;
            padding: 20px;
            display: none;
            z-index: 100;
        }
        #dealership-modal, #garage-modal {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .car-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid #ff007f;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .car-card h3 { margin: 0 0 5px 0; color: #00ffcc; font-size: 16px; }
        .car-card p { font-size: 13px; color: #bbb; margin-bottom: 8px; }
        .btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
            transition: 0.2s;
        }
        .btn:hover { background: #ff3399; box-shadow: 0 0 15px rgba(255, 51, 153, 1); }
        
        #menu-bar {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
        }
        .menu-btn {
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }
        .menu-btn:hover { background: #00ffcc; color: #000; }
        #controls-hint {
            position: absolute;
            bottom: 85px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>LEVEL 29 ENT: NOLA AAA</h1>
        <p id="speedometer">SPEED: 0 MPH</p>
        <p id="bank-balance" style="color: #00ffcc; margin-top: 5px;">BANK: $50,000</p>
    </div>

    <div id="controls-hint">Use <b>W / A / S / D</b> to Drive | <b>SPACE</b> to Drift | Open Dealership & Garage below</div>

    <div id="menu-bar">
        <button class="menu-btn" onclick="toggleModal('dealership-modal')">🚗 100-CAR DEALERSHIP</button>
        <button class="menu-btn" onclick="toggleModal('garage-modal')">🛠️ UPGRADE GARAGE</button>
    </div>

    <!-- 100-CAR DEALERSHIP MODAL -->
    <div id="dealership-modal" class="hud-panel">
        <div class="modal-header">
            <h2 style="margin:0; color:#00ffcc;">St. Claude Motors: 100-Car Showroom</h2>
            <button class="btn" onclick="toggleModal('dealership-modal')">✕</button>
        </div>
        <p style="margin-bottom:15px; font-size:13px; color:#aaa;">Choose from 100 authentic custom street racing builds.</p>
        <div class="car-grid" id="dealership-grid"></div>
    </div>

    <!-- UPGRADE GARAGE MODAL -->
    <div id="garage-modal" class="hud-panel">
        <div class="modal-header">
            <h2 style="margin:0; color:#ff007f;">Level 29 Tuning Workshop</h2>
            <button class="btn" onclick="toggleModal('garage-modal')">✕</button>
        </div>
        <div>
            <h3 style="color:#00ffcc;">Current Ride: <span id="current-car-name">1971 Chevy Impala Donk</span></h3>
            <div style="margin-top: 15px; display:flex; flex-direction:column; gap:10px;">
                <button class="btn" onclick="game.upgradeCar('Twin Turbo Kit', 5000, 0.15)">Upgrade Twin Turbo (+30 MPH Top Speed) - $5,000</button>
                <button class="btn" onclick="game.setCarColor(0xff0055, 0.1, 0.9)">Apply Candy Neon Pink Finish - $1,500</button>
                <button class="btn" onclick="game.setCarColor(0x00ffff, 0.1, 0.9)">Apply Electric Cyan Finish - $1,500</button>
                <button class="btn" onclick="game.upgradeCar('Hydraulics & Spinner Rims', 8000, 0.25)">Install Hydraulics & 30" Spinners - $8,000</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        class NolaStreetRacerGame {
            constructor() {
                this.playerMoney = 50000;
                this.maxSpeedKmh = 180; // Realistic street racing top speed in units
                this.currentMaxSpeed = 0.8;
                this.generateCatalog();
                this.initThree();
                this.initControls();
                this.populateDealershipUI();
                
                this.animate = this.animate.bind(this);
                this.animate();
            }

            generateCatalog() {
                const brands = ["Chevrolet", "Dodge", "Nissan", "Ford", "Toyota", "Cadillac", "Buick", "Mazda", "BMW", "Mercedes"];
                const models = ["Impala", "Hellcat", "Skyline R34", "Mustang GT", "Supra MK4", "Coupe de Ville", "Grand National", "RX-7", "M3 E30", "AMG GT"];
                this.catalog = [];
                for (let i = 1; i <= 100; i++) {
                    const brand = brands[i % brands.length];
                    const model = models[i % models.length] + ` Mk.${i}`;
                    const price = 15000 + (i * 3500);
                    const topSpeed = 0.8 + (i * 0.003);
                    this.catalog.push({ id: i, name: `${brand} ${model}`, price, topSpeed });
                }
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x04040c);
                this.scene.fog = new THREE.FogExp2(0x04040c, 0.006);

                this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x222244, 2.0);
                this.scene.add(ambientLight);

                const overheadLight = new THREE.DirectionalLight(0x5588ff, 2.5);
                overheadLight.position.set(30, 60, 30);
                overheadLight.castShadow = true;
                this.scene.add(overheadLight);

                // NOLA French Quarter Streetlights & Glowing Neon Facades
                for (let i = -600; i <= 600; i += 40) {
                    const color = i % 80 === 0 ? 0x00ffff : 0xff007f;
                    const pole = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.15, 0.2, 14, 8),
                        new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.8 })
                    );
                    pole.position.set(11, 7, i);
                    this.scene.add(pole);

                    const bulbLight = new THREE.PointLight(color, 4, 30);
                    bulbLight.position.set(11, 13, i);
                    this.scene.add(bulbLight);
                }

                // Road Setup (Width 22, perfectly scaled for car physics)
                const road = new THREE.Mesh(
                    new THREE.PlaneGeometry(22, 1400),
                    new THREE.MeshStandardMaterial({ color: 0x16161c, roughness: 0.5, metalness: 0.1 })
                );
                road.rotation.x = -Math.PI / 2;
                road.receiveShadow = true;
                this.scene.add(road);

                // Center Stripes
                for (let i = -680; i <= 680; i += 12) {
                    const stripe = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.4, 5),
                        new THREE.MeshBasicMaterial({ color: 0x00ffcc })
                    );
                    stripe.rotation.x = -Math.PI / 2;
                    stripe.position.set(0, 0.04, i);
                    this.scene.add(stripe);
                }

                // Close-Up New Orleans Skyline & French Quarter Buildings
                const bldMat = new THREE.MeshStandardMaterial({ color: 0x12121f, roughness: 0.7 });
                const windowGlowMat = new THREE.MeshBasicMaterial({ color: 0xffaa22 });

                for (let i = -650; i <= 650; i += 28) {
                    [-18, 18].forEach(xPos => {
                        const h = 35 + Math.random() * 55;
                        const bld = new THREE.Mesh(new THREE.BoxGeometry(14, h, 24), bldMat);
                        bld.position.set(xPos, h / 2, i);
                        bld.castShadow = true;
                        bld.receiveShadow = true;
                        this.scene.add(bld);

                        // Add glowing windows on building facades facing the street
                        const windowStrip = new THREE.Mesh(new THREE.PlaneGeometry(8, h * 0.7), windowGlowMat);
                        windowStrip.position.set(xPos > 0 ? xPos - 7.01 : xPos + 7.01, h / 2, i);
                        windowStrip.rotation.y = xPos > 0 ? -Math.PI / 2 : Math.PI / 2;
                        this.scene.add(windowStrip);
                    });
                }

                // Player Car
                this.carGroup = new THREE.Group();
                this.bodyMat = new THREE.MeshStandardMaterial({ color: 0x8800ff, roughness: 0.15, metalness: 0.85 });
                this.carBodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.65, 4.4), this.bodyMat);
                this.carBodyMesh.position.y = 0.6;
                this.carBodyMesh.castShadow = true;
                this.carGroup.add(this.carBodyMesh);

                const cabin = new THREE.Mesh(
                    new THREE.BoxGeometry(1.6, 0.55, 2.2),
                    new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.9 })
                );
                cabin.position.set(0, 1.15, -0.2);
                this.carGroup.add(cabin);

                const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.4, 24);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.2, metalness: 0.9 });
                
                [[-1.1, 0.38, 1.35], [1.1, 0.38, 1.35], [-1.1, 0.38, -1.35], [1.1, 0.38, -1.35]].forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.position.set(...pos);
                    this.carGroup.add(wheel);
                });

                this.scene.add(this.carGroup);
                this.carGroup.position.set(0, 0, 200);

                this.speed = 0;
                this.carAngle = 0;
            }

            initControls() {
                this.keys = { forward: false, backward: false, left: false, right: false, drift: false };
                window.addEventListener('keydown', (e) => this.updateKeys(e, true));
                window.addEventListener('keyup', (e) => this.updateKeys(e, false));
            }

            updateKeys(e, isDown) {
                switch(e.key.toLowerCase()) {
                    case 'w': case 'arrowup': this.keys.forward = isDown; break;
                    case 's': case 'arrowdown': this.keys.backward = isDown; break;
                    case 'a': case 'arrowleft': this.keys.left = isDown; break;
                    case 'd': case 'arrowright': this.keys.right = isDown; break;
                    case ' ': this.keys.drift = isDown; break;
                }
            }

            populateDealershipUI() {
                const grid = document.getElementById('dealership-grid');
                grid.innerHTML = '';
                this.catalog.forEach(car => {
                    const card = document.createElement('div');
                    card.className = 'car-card';
                    card.innerHTML = `
                        <h3>${car.name}</h3>
                        <p>Price: $${car.price.toLocaleString()} | Tier ${car.id}</p>
                        <button class="btn" id="buy-car-${car.id}">Buy Ride</button>
                    `;
                    grid.appendChild(card);
                    setTimeout(() => {
                        const btn = document.getElementById(`buy-car-${car.id}`);
                        if (btn) btn.onclick = () => this.buyCar(car);
                    }, 0);
                });
            }

            buyCar(car) {
                if (this.playerMoney >= car.price) {
                    this.playerMoney -= car.price;
                    this.currentMaxSpeed = car.topSpeed;
                    document.getElementById('bank-balance').innerText = `BANK: $${this.playerMoney.toLocaleString()}`;
                    document.getElementById('current-car-name').innerText = car.name;
                    alert(`Successfully purchased and deployed ${car.name}!`);
                    toggleModal('dealership-modal');
                } else {
                    alert("Not enough cash in your bank balance!");
                }
            }

            upgradeCar(name, cost, speedBoost) {
                if (this.playerMoney >= cost) {
                    this.playerMoney -= cost;
                    this.currentMaxSpeed += speedBoost;
                    document.getElementById('bank-balance').innerText = `BANK: $${this.playerMoney.toLocaleString()}`;
                    alert(`Installed ${name}! Performance upgraded.`);
                    toggleModal('garage-modal');
                } else {
                    alert("Insufficient funds for this upgrade package.");
                }
            }

            setCarColor(hex, roughness, metalness) {
                this.bodyMat.color.setHex(hex);
                this.bodyMat.roughness = roughness;
                this.bodyMat.metalness = metalness;
                alert("Custom candy paint finish applied!");
                toggleModal('garage-modal');
            }

            animate() {
                requestAnimationFrame(this.animate);

                const acceleration = 0.012;
                const deceleration = 0.008;
                const turnSpeed = 0.045;

                if (this.keys.forward) this.speed = Math.min(this.speed + acceleration, this.currentMaxSpeed);
                else if (this.keys.backward) this.speed = Math.max(this.speed - acceleration, -this.currentMaxSpeed / 3);
                else {
                    if (this.speed > 0) this.speed = Math.max(this.speed - deceleration, 0);
                    if (this.speed < 0) this.speed = Math.min(this.speed + deceleration, 0);
                }

                let currentTurn = turnSpeed;
                if (this.keys.drift) currentTurn *= 1.6;

                if (Math.abs(this.speed) > 0.03) {
                    if (this.keys.left) { this.carAngle += currentTurn * Math.sign(this.speed); this.carGroup.rotation.y = this.carAngle; }
                    if (this.keys.right) { this.carAngle -= currentTurn * Math.sign(this.speed); this.carGroup.rotation.y = this.carAngle; }
                }

                this.carGroup.position.x += Math.sin(this.carAngle) * this.speed;
                this.carGroup.position.z += Math.cos(this.carAngle) * this.speed;

                // Infinite road looping
                if (this.carGroup.position.z < -600) this.carGroup.position.z = 600;
                if (this.carGroup.position.z > 600) this.carGroup.position.z = -600;
                this.carGroup.position.x = Math.max(Math.min(this.carGroup.position.x, 9.5), -9.5);

                // Cinematic Chase Camera
                const targetX = this.carGroup.position.x - Math.sin(this.carAngle) * 11;
                const target
